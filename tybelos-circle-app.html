    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --midnight-blue: #0a0e27;
            --deep-navy: #141b3d;
            --accent-cyan: #6dd5ed;
            --text-primary: #e8eaed;
            --text-secondary: #9ca3af;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
            touch-action: pan-y;
            user-select: none;
        }

        .container {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            padding: env(safe-area-inset-top, 20px) 20px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(20, 27, 61, 0.8);
            backdrop-filter: blur(10px);
        }

        .app-title {
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .install-btn {
            padding: 8px 16px;
            background: rgba(109, 213, 237, 0.2);
            border: 1px solid var(--accent-cyan);
            border-radius: 20px;
            color: var(--accent-cyan);
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .install-btn:active {
            transform: scale(0.95);
            background: rgba(109, 213, 237, 0.3);
        }

        /* Main Content */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            overflow-y: auto;
        }

        .screen {
            display: none;
            width: 100%;
            max-width: 600px;
            animation: fadeIn 0.3s ease;
        }

        .screen.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Voice Session Screen */
        .voice-session {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .ai-avatar {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, var(--accent-cyan), #2a4b8f);
            box-shadow: 0 0 60px rgba(109, 213, 237, 0.4);
            margin-bottom: 40px;
            position: relative;
            animation: breathe 4s ease-in-out infinite;
        }

        @keyframes breathe {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .status-text {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .subtext {
            font-size: 16px;
            color: var(--text-secondary);
            margin-bottom: 40px;
        }

        .waveform {
            display: flex;
            gap: 6px;
            height: 50px;
            align-items: center;
            justify-content: center;
            margin-bottom: 60px;
        }

        .wave-bar {
            width: 4px;
            background: linear-gradient(to top, var(--accent-cyan), #8ec5fc);
            border-radius: 4px;
            animation: wave 1.2s ease-in-out infinite;
        }

        .wave-bar:nth-child(1) { height: 16px; animation-delay: 0s; }
        .wave-bar:nth-child(2) { height: 32px; animation-delay: 0.1s; }
        .wave-bar:nth-child(3) { height: 48px; animation-delay: 0.2s; }
        .wave-bar:nth-child(4) { height: 32px; animation-delay: 0.3s; }
        .wave-bar:nth-child(5) { height: 20px; animation-delay: 0.4s; }
        .wave-bar:nth-child(6) { height: 36px; animation-delay: 0.5s; }
        .wave-bar:nth-child(7) { height: 24px; animation-delay: 0.6s; }

        @keyframes wave {
            0%, 100% { transform: scaleY(1); }
            50% { transform: scaleY(1.5); }
        }

        .mic-button {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: var(--accent-cyan);
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(109, 213, 237, 0.3);
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }

        .mic-button:active {
            transform: scale(0.9);
        }

        .mic-button.recording {
            background: #ef4444;
            animation: pulse 1s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 10px 30px rgba(239, 68, 68, 0.3); }
            50% { box-shadow: 0 10px 50px rgba(239, 68, 68, 0.6); }
        }

        .action-button {
            padding: 16px 48px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 28px;
            color: var(--text-primary);
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .action-button:active {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.08);
        }

        /* Wellbeing Screen */
        .wellbeing-screen h2 {
            font-size: 24px;
            margin-bottom: 30px;
            text-align: center;
        }

        .mood-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 40px;
        }

        .mood-option {
            aspect-ratio: 1;
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .mood-option:active {
            transform: scale(0.95);
            background: rgba(109, 213, 237, 0.1);
            border-color: var(--accent-cyan);
        }

        .mood-emoji {
            font-size: 40px;
        }

        .mood-label {
            font-size: 12px;
            color: var(--text-secondary);
        }

        /* Bottom Navigation */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            padding: 12px 20px env(safe-area-inset-bottom, 20px);
            background: rgba(20, 27, 61, 0.9);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 8px 16px;
            color: var(--text-secondary);
            font-size: 11px;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 12px;
        }

        .nav-item.active {
            color: var(--accent-cyan);
            background: rgba(109, 213, 237, 0.1);
        }

        .nav-icon {
            font-size: 24px;
        }

        /* Install Prompt */
        .install-prompt {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(10, 14, 39, 0.98), transparent);
            padding: 30px 20px env(safe-area-inset-bottom, 20px);
            transform: translateY(100%);
            transition: transform 0.3s ease;
            z-index: 1000;
        }

        .install-prompt.show {
            transform: translateY(0);
        }

        .install-prompt-content {
            background: rgba(109, 213, 237, 0.1);
            border: 1px solid var(--accent-cyan);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
        }

        .install-prompt h3 {
            font-size: 18px;
            margin-bottom: 8px;
        }

        .install-prompt p {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 16px;
        }

        .install-prompt-buttons {
            display: flex;
            gap: 12px;
        }

        .install-prompt button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
        }

        .install-prompt .btn-install {
            background: var(--accent-cyan);
            color: #0a0e27;
        }

        .install-prompt .btn-later {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
        }

        /* Message */
        .message {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: rgba(109, 213, 237, 0.9);
            color: #0a0e27;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            transition: transform 0.3s ease;
            z-index: 1000;
        }

        .message.show {
            transform: translateX(-50%) translateY(0);
        }

        /* Loader */
        .loader {
            display: none;
            margin: 20px auto;
            width: 40px;
            height: 40px;
            border: 4px solid rgba(109, 213, 237, 0.2);
            border-top-color: var(--accent-cyan);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .loader.show {
            display: block;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="app-title">Tybelos Circle</div>
            <button class="install-btn" id="installButton" style="display: none;">Installa</button>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Voice Session Screen -->
            <div class="screen active" id="voiceScreen">
                <div class="voice-session">
                    <div class="ai-avatar"></div>
                    <div class="status-text" id="statusText">Pronto</div>
                    <div class="subtext" id="subtext">Tocca il microfono per parlare</div>
                    
                    <div class="waveform" id="waveform" style="display: none;">
                        <div class="wave-bar"></div>
                        <div class="wave-bar"></div>
                        <div class="wave-bar"></div>
                        <div class="wave-bar"></div>
                        <div class="wave-bar"></div>
                        <div class="wave-bar"></div>
                        <div class="wave-bar"></div>
                    </div>

                    <button class="mic-button" id="micButton">🎤</button>
                    <div class="loader" id="loader"></div>
                    <button class="action-button" id="endButton" style="display: none;">Fine Sessione</button>
                </div>
            </div>

            <!-- Wellbeing Check Screen -->
            <div class="screen" id="wellbeingScreen">
                <div class="wellbeing-screen">
                    <h2>Come ti senti oggi?</h2>
                    <div class="mood-grid">
                        <div class="mood-option" data-mood="calm">
                            <div class="mood-emoji">😌</div>
                            <div class="mood-label">Calmo</div>
                        </div>
                        <div class="mood-option" data-mood="happy">
                            <div class="mood-emoji">😊</div>
                            <div class="mood-label">Felice</div>
                        </div>
                        <div class="mood-option" data-mood="sad">
                            <div class="mood-emoji">😔</div>
                            <div class="mood-label">Triste</div>
                        </div>
                        <div class="mood-option" data-mood="anxious">
                            <div class="mood-emoji">😰</div>
                            <div class="mood-label">Ansioso</div>
                        </div>
                        <div class="mood-option" data-mood="neutral">
                            <div class="mood-emoji">😐</div>
                            <div class="mood-label">Neutrale</div>
                        </div>
                        <div class="mood-option" data-mood="tired">
                            <div class="mood-emoji">😴</div>
                            <div class="mood-label">Stanco</div>
                        </div>
                    </div>
                    <button class="action-button" onclick="showScreen('voiceScreen')">Torna Indietro</button>
                </div>
            </div>
        </div>

        <!-- Bottom Navigation -->
        <div class="bottom-nav">
            <div class="nav-item active" onclick="showScreen('voiceScreen')">
                <div class="nav-icon">🎙️</div>
                <div>Voce</div>
            </div>
            <div class="nav-item" onclick="showScreen('wellbeingScreen')">
                <div class="nav-icon">💙</div>
                <div>Benessere</div>
            </div>
            <div class="nav-item" onclick="showMessage('Memoria - Disponibile presto!')">
                <div class="nav-icon">📝</div>
                <div>Memoria</div>
            </div>
            <div class="nav-item" onclick="showMessage('Circle Feed - Disponibile presto!')">
                <div class="nav-icon">🌐</div>
                <div>Circle</div>
            </div>
        </div>

        <!-- Install Prompt -->
        <div class="install-prompt" id="installPrompt">
            <div class="install-prompt-content">
                <h3>Installa Tybelos Circle</h3>
                <p>Aggiungi l'app alla schermata home per un accesso rapido</p>
                <div class="install-prompt-buttons">
                    <button class="btn-install" onclick="installApp()">Installa</button>
                    <button class="btn-later" onclick="hideInstallPrompt()">Più Tardi</button>
                </div>
            </div>
        </div>

        <!-- Message Toast -->
        <div class="message" id="message"></div>
    </div>

    <script>
        // PWA Install
        let deferredPrompt;
        const installButton = document.getElementById('installButton');
        const installPrompt = document.getElementById('installPrompt');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installButton.style.display = 'block';
            
            // Show install prompt after 3 seconds
            setTimeout(() => {
                installPrompt.classList.add('show');
            }, 3000);
        });

        async function installApp() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                console.log(`User response: ${outcome}`);
                deferredPrompt = null;
            }
            hideInstallPrompt();
        }

        function hideInstallPrompt() {
            installPrompt.classList.remove('show');
        }

        installButton.addEventListener('click', installApp);

        // Voice Recognition
        let recognition = null;
        let isRecording = false;

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'it-IT';
            recognition.continuous = false;
            recognition.interimResults = true;

            recognition.onstart = () => {
                console.log('Voice recognition started');
                isRecording = true;
                updateVoiceUI(true);
            };

            recognition.onresult = (event) => {
                const transcript = Array.from(event.results)
                    .map(result => result[0].transcript)
                    .join('');
                
                document.getElementById('subtext').textContent = transcript;
                
                if (event.results[0].isFinal) {
                    handleVoiceInput(transcript);
                }
            };

            recognition.onerror = (event) => {
                console.error('Speech recognition error:', event.error);
                showMessage('Errore: ' + event.error);
                stopRecording();
            };

            recognition.onend = () => {
                console.log('Voice recognition ended');
                isRecording = false;
                updateVoiceUI(false);
            };
        }

        const micButton = document.getElementById('micButton');
        micButton.addEventListener('click', toggleRecording);

        function toggleRecording() {
            if (!recognition) {
                showMessage('Riconoscimento vocale non supportato su questo browser');
                return;
            }

            if (isRecording) {
                stopRecording();
            } else {
                startRecording();
            }
        }

        function startRecording() {
            try {
                recognition.start();
                showMessage('Sto ascoltando...');
            } catch (error) {
                console.error('Error starting recording:', error);
                showMessage('Errore nell\'avviare il microfono');
            }
        }

        function stopRecording() {
            if (recognition) {
                recognition.stop();
            }
            updateVoiceUI(false);
        }

        function updateVoiceUI(recording) {
            micButton.classList.toggle('recording', recording);
            micButton.textContent = recording ? '⏸️' : '🎤';
            document.getElementById('waveform').style.display = recording ? 'flex' : 'none';
            document.getElementById('statusText').textContent = recording ? 'In ascolto...' : 'Pronto';
            document.getElementById('endButton').style.display = recording ? 'block' : 'none';
            
            if (!recording) {
                document.getElementById('subtext').textContent = 'Tocca il microfono per parlare';
            }
        }

        async function handleVoiceInput(transcript) {
            document.getElementById('loader').classList.add('show');
            document.getElementById('statusText').textContent = 'Sto pensando...';
            
            // Simulate AI response
            await new Promise(resolve => setTimeout(resolve, 1500));
            
            const responses = [
                "Ti ascolto. Dimmi di più su come ti senti.",
                "Capisco. Questo deve essere difficile per te.",
                "Grazie per aver condiviso questo con me. Come posso aiutarti?",
                "Mi sembra che tu stia affrontando una sfida. Vuoi parlarne?",
                "È normale sentirsi così. Sei una persona forte."
            ];
            
            const response = responses[Math.floor(Math.random() * responses.length)];
            
            document.getElementById('loader').classList.remove('show');
            document.getElementById('statusText').textContent = 'Sto rispondendo...';
            document.getElementById('subtext').textContent = response;
            
            // Speak response
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(response);
                utterance.lang = 'it-IT';
                utterance.rate = 0.9;
                utterance.pitch = 1;
                speechSynthesis.speak(utterance);
                
                utterance.onend = () => {
                    document.getElementById('statusText').textContent = 'Pronto';
                    document.getElementById('subtext').textContent = 'Tocca il microfono per continuare';
                };
            }
            
            showMessage('Risposta generata!');
        }

        // Screen Navigation
        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(screen => {
                screen.classList.remove('active');
            });
            document.getElementById(screenId).classList.add('active');

            document.querySelectorAll('.nav-item').forEach(item => {
                item.classList.remove('active');
            });
            event.currentTarget.classList.add('active');
        }

        // Mood Selection
        document.querySelectorAll('.mood-option').forEach(option => {
            option.addEventListener('click', function() {
                const mood = this.dataset.mood;
                const moodLabels = {
                    calm: 'calmo',
                    happy: 'felice',
                    sad: 'triste',
                    anxious: 'ansioso',
                    neutral: 'neutrale',
                    tired: 'stanco'
                };
                showMessage(`Hai selezionato: ${moodLabels[mood]}`);
                setTimeout(() => showScreen('voiceScreen'), 1000);
            });
        });

        // Message Toast
        function showMessage(text) {
            const messageEl = document.getElementById('message');
            messageEl.textContent = text;
            messageEl.classList.add('show');
            setTimeout(() => {
                messageEl.classList.remove('show');
            }, 3000);
        }

        // End Session
        document.getElementById('endButton').addEventListener('click', () => {
            stopRecording();
            showMessage('Sessione terminata. A presto!');
        });

        // Service Worker Registration
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('data:application/javascript;base64,c2VsZi5hZGRFdmVudExpc3RlbmVyKCdpbnN0YWxsJywgZnVuY3Rpb24oZSkge2NvbnNvbGUubG9nKCdTZXJ2aWNlIFdvcmtlciBpbnN0YWxsZWQnKTt9KTtzZWxmLmFkZEV2ZW50TGlzdGVuZXIoJ2FjdGl2YXRlJywgZnVuY3Rpb24oZSl7Y29uc29sZS5sb2coJ1NlcnZpY2UgV29ya2VyIGFjdGl2YXRlZCcpO30pOw==')
                    .then(reg => console.log('Service Worker registered'))
                    .catch(err => console.log('Service Worker registration failed'));
            });
        }

        // Prevent zoom on double tap
        let lastTouchEnd = 0;
        document.addEventListener('touchend', (e) => {
            const now = Date.now();
            if (now - lastTouchEnd <= 300) {
                e.preventDefault();
            }
            lastTouchEnd = now;
        }, false);
    </script>
</body>
